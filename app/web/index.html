<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>THE ROOM — Chapter I: The Last Ledger</title>
<style>
  :root{
    --bone:#e4ded0; --sienna:#8a4a28; --oxide:#8e2b22; --arsenic:#7d8f5e;
    --gold:#c9a227; --ink:#0a0a0b; --dust:#9a938a; --warm:#f0d9a8;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#000;color:var(--bone);
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    -webkit-font-smoothing:antialiased}
  #stage{position:relative;max-width:1080px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
  .frame{position:relative;aspect-ratio:16/10;width:100%;background:#000;overflow:hidden;
    box-shadow:0 0 60px rgba(0,0,0,.9) inset}
  svg.scene{position:absolute;inset:0;width:100%;height:100%;display:block}
  .hot{cursor:pointer}
  .hot:hover{filter:brightness(1.35)}
  /* ---------- animation ---------- */
  @keyframes flick{0%,97%,100%{opacity:1}97.6%{opacity:.35}98.2%{opacity:.9}98.8%{opacity:.5}}
  #bulbglow,#bulbcore{animation:flick 20s linear infinite}
  @keyframes rainrun{from{transform:translateY(-14px)}to{transform:translateY(46px)}}
  .rain{animation:rainrun 2.4s linear infinite}
  .rain:nth-child(2){animation-duration:3.1s;animation-delay:-.7s}
  .rain:nth-child(3){animation-duration:2.7s;animation-delay:-1.4s}
  .rain:nth-child(4){animation-duration:3.4s;animation-delay:-2s}
  @keyframes smoke{0%{opacity:0;transform:translate(0,0) scale(.7)}
    25%{opacity:.5}100%{opacity:0;transform:translate(-9px,-46px) scale(1.5)}}
  .smoke{animation:smoke 3.2s ease-out infinite}
  .smoke:nth-child(2){animation-delay:1.1s}
  .smoke:nth-child(3){animation-delay:2.2s}
  .smokeoff .smoke{animation:none;opacity:0}
  @keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.05)}}
  #eyes{transform-origin:center;transform-box:fill-box}
  #eyes.on{animation:blink 5.2s linear infinite}
  #eyes{opacity:0;transition:opacity 1.2s}
  #eyes.on{opacity:1}
  /* ---------- ui ---------- */
  #hud{display:flex;gap:18px;align-items:baseline;padding:10px 16px;font-size:12.5px;
    letter-spacing:.14em;text-transform:uppercase;color:#6f6a62;border-bottom:1px solid #16161a}
  #hud b{color:var(--bone);font-weight:600;letter-spacing:.06em}
  #hud .sp{margin-left:auto;font-variant-numeric:tabular-nums}
  #panel{padding:20px 22px 34px;flex:1}
  #who{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--arsenic);margin-bottom:9px}
  #line{font-size:21px;line-height:1.52;min-height:3.2em;max-width:62ch}
  #line .st{color:var(--dust);font-style:italic}
  #tells{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 4px;min-height:1px}
  .tell{font-size:12.5px;letter-spacing:.06em;padding:5px 11px;border:1px solid #3a3a30;
    border-radius:999px;background:#0e0e10;color:#b9b2a5;cursor:pointer}
  .tell:hover{border-color:var(--gold);color:var(--warm)}
  .tell.read{opacity:.4;cursor:default;border-style:dashed}
  #objects{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 14px}
  .obj{font-size:12px;letter-spacing:.07em;padding:4px 10px;border:1px dotted #39342c;
    color:#8b857b;cursor:pointer;background:none}
  .obj:hover{color:var(--bone);border-color:#6d6555}
  .obj.seen{opacity:.4;cursor:default}
  #note{margin:10px 0 0;font-size:15.5px;color:var(--warm);min-height:1.4em;line-height:1.5}
  #choices{display:flex;flex-direction:column;gap:9px;margin-top:20px}
  .ch{text-align:left;font:inherit;font-size:17px;line-height:1.4;padding:13px 16px;
    background:#0c0c0e;border:1px solid #23231f;color:var(--bone);cursor:pointer;transition:.15s}
  .ch:hover{background:#14140f;border-color:var(--sienna)}
  .ch .tag{display:block;font-size:11px;letter-spacing:.18em;text-transform:uppercase;
    color:#625c52;margin-bottom:4px}
  .ch.call .tag{color:var(--gold)}
  .ch.sk .tag{color:var(--oxide)}
  /* ---------- overlays ---------- */
  #veil{position:fixed;inset:0;background:#000;display:none;flex-direction:column;
    align-items:center;justify-content:center;z-index:50;padding:30px;text-align:center}
  #veil.show{display:flex}
  #vig{width:190px;height:150px;margin-bottom:26px}
  #vcap{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:#4e4a43;min-height:1.4em}
  #score{display:none;gap:46px;margin-top:8px}
  #score.show{display:flex}
  #score div{text-align:center}
  #score span{display:block;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#5d574e}
  #score b{font-size:40px;font-weight:400;color:var(--bone);font-variant-numeric:tabular-nums}
  #unmeas{margin-top:26px;color:#4e4a43;font-size:14px;font-style:italic;display:none}
  #after{margin-top:16px;max-width:46ch;color:var(--dust);font-size:17px;line-height:1.5;display:none}
  #vbtn{margin-top:34px;display:none;font:inherit;font-size:14px;letter-spacing:.16em;
    text-transform:uppercase;background:none;border:1px solid #33322c;color:#9a938a;padding:11px 24px;cursor:pointer}
  #vbtn:hover{color:var(--bone);border-color:var(--gold)}
  #title{position:fixed;inset:0;background:#000;z-index:60;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;padding:30px}
  #title h1{font-size:clamp(34px,7vw,74px);margin:0;letter-spacing:.3em;font-weight:400}
  #title h2{font-size:clamp(13px,2vw,17px);letter-spacing:.34em;text-transform:uppercase;
    color:var(--arsenic);margin:18px 0 0;font-weight:400}
  #title p{max-width:50ch;color:#746e65;line-height:1.6;margin:34px 0 0;font-size:16px}
  #modes{display:flex;gap:12px;margin-top:38px;flex-wrap:wrap;justify-content:center}
  #modes button{font:inherit;font-size:14px;letter-spacing:.16em;text-transform:uppercase;
    background:none;border:1px solid #33322c;color:#9a938a;padding:12px 26px;cursor:pointer}
  #modes button:hover{color:var(--bone);border-color:var(--gold)}
  .fade{animation:fin 1.1s ease both}
  @keyframes fin{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>
<div id="stage">
  <div class="frame" id="frame"></div>
  <div id="hud">
    <span>Insight <b id="hI">0</b></span><span>Craft <b id="hC">0</b></span>
    <span>Edge <b id="hE">0</b></span><span class="sp" id="hClock">23:00</span>
  </div>
  <div id="panel">

    <div id="line"></div>
    <div id="tells"></div>
    <div id="objects"></div>
    <p id="note"></p>
    <div id="choices"></div>
  </div>
</div>

<div id="veil">
  <svg id="vig" viewBox="0 0 190 150"></svg>
  <div id="vcap"></div>
  <div id="score">
    <div><span>Insight</span><b id="sI">0</b></div>
    <div><span>Craft</span><b id="sC">0</b></div>
    <div><span>Edge</span><b id="sE">0</b></div>
  </div>
  <div id="unmeas">Not everything in that room was measured.</div>
  <div id="after"></div>
  <button id="vbtn">Close the room</button>
</div>

<div id="title">
  <h1>THE ROOM</h1>
  <h2>Chapter I &mdash; The Last Ledger</h2>
  <p>Antwerp. Eleven days after Daniel Voss went missing. His wife has told the
     police the same thing four times. You knew him before the money.</p>
  <div id="modes">
    <button data-m="medium">Medium</button>
    <button data-m="hard">Hard</button>
  </div>
</div>

: {"line_by_state": [{"if": "revealed:she_was_asked", "line": "He turned a lighter over and over and he did not smoke. [She looks at him. First time tonight.] He is in that photograph."}, {"if": "trust>=60", "line": "[She looks at him. First time tonight.] They will ask what he was like. I will have to say I do not know. That will be true."}, {"else": true, "line": "He did not say which one. He said you would know, and that you would come here first."}]}}, "debrief_add": {"tells": ["t_preempt", "t_offload"], "hidden_objection": "she_was_asked"}};

<script>
/* ===================== ENGINE ===================== */
const $=id=>document.getElementById(id);
let R, S;

function mergeOverlay(base, ov){
  const r = JSON.parse(JSON.stringify(base));
  r.mode = ov.mode;
  r.clean_requires = ov.clean_requires || [];
  (ov.hidden_objection_layers_add||[]).forEach(l=>r.hidden_objection_layers.push(l));
  for(const [nid,patch] of Object.entries(ov.patch_nodes||{})){
    const n = r.nodes[nid]; if(!n) continue;
    for(const [k,v] of Object.entries(patch)){
      if(k==="choices_add"){ n.choices=(n.choices||[]).concat(v); }
      else if(k==="line_by_state"){ delete n.line; n.line_by_state=v; }
      else if(k==="line"){ delete n.line_by_state; n.line=v; }
      else n[k]=v;
    }
  }
  const w = ov.tell_window_default||1;
  Object.values(r.nodes).forEach(n=>(n.tells||[]).forEach(t=>t.window=Math.min(t.window??3,w)));
  const d = ov.debrief_add||{};
  (d.tells||[]).forEach(t=>r.debrief.tells.push(t));
  if(d.hidden_objection) r.debrief.hidden_objection.push(d.hidden_objection);
  return r;
}

function evalCond(expr){
  if(!expr) return true;
  return String(expr).split("&&").every(part=>{
    const p = part.trim();
    let m = p.match(/^revealed:(\w+)$/);           if(m) return S.revealed.has(m[1]);
    m = p.match(/^trust\s*(>=|<=|>|<)\s*(\d+)$/);
    if(m){ const t=S.trust, v=+m[2];
      return m[1]===">="?t>=v:m[1]==="<="?t<=v:m[1]===">"?t>v:t<v; }
    m = p.match(/^call:(\w+)$/);                   if(m) return S.flags.has("call:"+m[1]);
    return true;
  });
}

function resolveLine(node){
  if(node.line_by_state){
    for(const o of node.line_by_state){
      if(o.else || evalCond(o.if)) return o;
    }
  }
  return node;
}

function newGame(mode){
  R = mode==="hard" ? mergeOverlay(MEDIUM, HARD) : JSON.parse(JSON.stringify(MEDIUM));
  if(mode!=="hard") R.clean_requires = [];
  const tr = mode==="hard" ? 25 : 35;
  S = { mode, node:R.start, turn:0, trust:tr, fear:20, integrity:10,
        insight:0, craft:0, edge:0, looks:4,
        revealed:new Set(), flags:new Set(), seenObjects:new Set(),
        readTells:new Set(), offeredTells:new Set(), active:new Map(),
        ended:false, end:null, facing:false, smoking:true };
  $("frame").innerHTML = SCENE;
  startClock();
  enter(R.start);
}

function startClock(){
  const tick = ()=>{
    const now = new Date();
    const slow = new Date(now.getTime() - 4*60*1000);
    let h = 23, m = 0 + (slow.getSeconds()%60===0?0:0);
    // fixed story time 23:00, four minutes slow => shows 22:56, second hand real
    const sec = slow.getSeconds();
    const sh=$("csh"), mh=$("cmh"), hh=$("chh");
    if(sh) sh.setAttribute("transform",`rotate(${sec*6} 722 96)`);
    if(mh) mh.setAttribute("transform",`rotate(${(56/60)*360} 722 96)`);
    if(hh) hh.setAttribute("transform",`rotate(${(22.93/12)*360} 722 96)`);
    $("hClock").textContent = "22:56";
  };
  tick(); clearInterval(window._ck); window._ck=setInterval(tick,1000);
}

function enter(nid){
  S.node = nid;
  const node = R.nodes[nid];
  if(node.end){ return finish(node); }
  const opt = resolveLine(node);
  if(node.reveals) S.revealed.add(node.reveals);
  if(opt.reveals) S.revealed.add(opt.reveals);
  // tells
  (node.tells||[]).forEach(t=>{
    if(!evalCond(t.condition)) return;
    S.active.set(t.id,{t, dies:S.turn + (t.window??3)});
    S.offeredTells.add(t.id);
  });
  // eyes / smoke staging
  const last = nid==="a7";
  setFacing(last && (S.trust>=60 || S.revealed.has("she_was_asked")));
  if(S.trust>=48 && (nid==="a4"||nid==="a5"||nid==="a6"||nid==="a7")) setSmoking(false);
  render(opt.line || node.line);
}

function setFacing(on){
  S.facing = on;
  const e=$("eyes"); if(e) e.className = on ? "on" : "";
}
function setSmoking(on){
  S.smoking = on;
  const g=$("smokeg"), c=$("cig");
  if(g) g.classList.toggle("smokeoff", !on);
  if(c) c.style.opacity = on ? 1 : .25;
}

function fmt(txt){
  return txt.replace(/\[([^\]]+)\]/g,'<span class="st">$1</span>');
}

function render(line){
  $("line").className="fade";
  $("line").innerHTML = fmt(line);
  void $("line").offsetWidth;
  // tells
  const tl=$("tells"); tl.innerHTML="";
  [...S.active.entries()].forEach(([id,rec])=>{
    if(S.turn > rec.dies) { S.active.delete(id); return; }
    const b=document.createElement("button");
    b.className="tell"+(S.readTells.has(id)?" read":"");
    b.textContent = rec.t.anchor.replace(/^(phrase|gesture|object):/,"");
    if(!S.readTells.has(id)) b.onclick=()=>readTell(id);
    tl.appendChild(b);
  });
  // objects
  const ob=$("objects"); ob.innerHTML="";
  (R.objects||[]).forEach(o=>{
    const b=document.createElement("button");
    b.className="obj"+(S.seenObjects.has(o.id)?" seen":"");
    b.textContent=o.label;
    if(!S.seenObjects.has(o.id)) b.onclick=()=>examine(o.id);
    ob.appendChild(b);
  });
  hookScene();
  // choices
  const cs=$("choices"); cs.innerHTML="";
  available().forEach(c=>{
    const b=document.createElement("button");
    b.className="ch"+(c.type==="call"?" call":"")+(c.skull?" sk":"");
    const tag = c.type==="call" ? "call &mdash; name the tactic"
              : c.skull ? "this one is not clean" : c.type.replace(/_/g," ");
    b.innerHTML=`<span class="tag">${tag}</span>${c.text}`;
    b.onclick=()=>choose(c);
    cs.appendChild(b);
  });
  $("hI").textContent=S.insight; $("hC").textContent=S.craft; $("hE").textContent=S.edge;
}

function hookScene(){
  const map={obj_photo:"photo",obj_clock:"clockg",obj_cup:"cup",obj_ring:"ring"};
  for(const [oid,gid] of Object.entries(map)){
    const g=$(gid); if(!g) continue;
    if(S.seenObjects.has(oid)){ g.classList.remove("hot"); g.onclick=null; }
    else { g.classList.add("hot"); g.onclick=()=>examine(oid); }
  }
}

function available(){
  const node=R.nodes[S.node];
  return (node.choices||[]).filter(c=>{
    if(c.condition && !evalCond(c.condition)) return false;
    if(c.requires_tell && !S.readTells.has(c.requires_tell)) return false;
    if(c.requires_object && !S.seenObjects.has(c.requires_object)) return false;
    return true;
  });
}

function readTell(id){
  const rec=S.active.get(id); if(!rec) return;
  S.readTells.add(id);
  const t=rec.t;
  let txt = t.reading;
  if(S.mode!=="hard" && t.false_positive) txt += "  —  Or: " + t.false_positive;
  $("note").innerHTML = fmt(txt);
  render(currentLine());
}

function examine(oid){
  const o=(R.objects||[]).find(x=>x.id===oid); if(!o) return;
  if(S.looks < (o.insight_cost||0)){ $("note").textContent="No looks left in this room."; return; }
  S.looks -= (o.insight_cost||0);
  S.seenObjects.add(oid);
  $("note").innerHTML = fmt(o.reveals_text);
  if(o.grants_tell){
    const t = findTell(o.grants_tell);
    if(t){ S.active.set(t.id,{t,dies:S.turn+3}); S.offeredTells.add(t.id); }
  }
  render(currentLine());
}

function findTell(id){
  for(const n of Object.values(R.nodes))
    for(const t of (n.tells||[])) if(t.id===id) return t;
  return null;
}

function currentLine(){
  const node=R.nodes[S.node];
  const opt=resolveLine(node);
  return opt.line || node.line;
}

function choose(c){
  const d=c.deltas||{};
  S.trust = Math.max(0, Math.min(100, S.trust + (d.trust||0)));
  S.fear  = Math.max(0, Math.min(100, S.fear  + (d.fear||0)));
  if(c.skull){
    S.integrity -= (c.integrity_cost||1);
    if(!c.detected) S.edge += 2;
    S.flags.add("skull");
  } else if(!c.unscored && c.truthful && c.preserves_refusal){
    if(c.type!=="silence" || !c.unscored) S.craft += 1;
  }
  if(c.type==="call"){
    const seen = S.readTells.has(c.requires_tell);
    if(seen){ S.insight += 2; S.flags.add("call:"+c.calls_tactic); }
    else { S.trust -= 10; }
  }
  if(c.targets==="hidden" && !c.skull) S.insight += 1;
  if(c.sets_flag) S.flags.add(c.sets_flag);
  S.turn += (c.turn_cost===0?0:1);
  $("note").textContent="";
  if(S.turn >= (R.turn_limit||12) && !R.nodes[c.next].end) return finish({end:"partial",
    architect:"The hour ran out. She stops talking and waits for you to leave."});
  enter(c.next);
}

/* ===================== DEBRIEF ===================== */

  t_ring:`<circle cx="95" cy="80" r="26" fill="none" stroke="#c9a227" stroke-width="5"/>

  t_home:`<text x="95" y="86" fill="#e4ded0" font-size="26" text-anchor="middle"
          font-family="Georgia,serif">home</text>

            <rect x="100" y="60" width="6" height="20"/><rect x="110" y="59" width="6" height="21"/></g>`,

            <ellipse cx="95" cy="110" rx="40" ry="9" fill="#2b2b26"/>`,

               <circle cx="122" cy="62" r="4" fill="#55504a"/>`,
  t_preempt:`<path d="M48 78 h94" stroke="#8e2b22" stroke-width="4"/>
             <path d="M48 96 h62" stroke="#8e2b22" stroke-width="4" opacity=".5"/>`,
  t_offload:`<path d="M46 86 l80 0 -18 -16 m18 16 -18 16" fill="none" stroke="#9a938a" stroke-width="4"/>`,
  t_my_husband:`<text x="95" y="88" fill="#9a938a" font-size="19" text-anchor="middle"
            font-family="Georgia,serif">my husband</text>`
};

function finish(node){
  S.ended=true; S.end=node.end;
  clearInterval(window._ck);
  if(node.end==="clean" && (R.clean_requires||[]).length){
    if(!R.clean_requires.every(f=>S.flags.has(f))) S.end="partial";
  }
  const missed = [...new Set((R.debrief.tells||[]))]
    .filter(id=>!S.readTells.has(id) && VIGNETTES[id]);
  const veil=$("veil"); veil.classList.add("show");
  let i=0;
  const vig=$("vig");
  const step=()=>{
    if(i<missed.length){
      vig.innerHTML = VIGNETTES[missed[i]];
      vig.className="fade"; void vig.offsetWidth;
      $("vcap").textContent="";
      i++; setTimeout(step,3000);
    } else {
      vig.innerHTML="";
      $("vcap").textContent = missed.length? "you walked past these" : "you missed nothing";
      $("score").classList.add("show");
      animate($("sI"),S.insight); animate($("sC"),S.craft); animate($("sE"),S.edge);
      setTimeout(()=>{ $("unmeas").style.display="block"; },900);
      setTimeout(()=>{
        const aft = (R.debrief.afterword||{})[S.end] || "";
        $("after").innerHTML = "<div>"+node.architect+"</div>"+(aft?"<div style='margin-top:10px'>"+aft+"</div>":"");
        $("after").style.display="block";
        $("vbtn").style.display="block";
      },1700);
    }
  };
  setTimeout(step,2000);
}

function animate(el,to){
  let v=0; const t=setInterval(()=>{ v++; el.textContent=v; if(v>=to) clearInterval(t); },90);
  if(to===0) el.textContent="0";
}

window.__dbg=()=>({end:S.end,insight:S.insight,craft:S.craft,edge:S.edge,integrity:S.integrity,trust:S.trust,flags:[...S.flags],revealed:[...S.revealed]});

  $("veil").classList.remove("show");
  $("score").classList.remove("show");
  $("unmeas").style.display="none"; $("after").style.display="none"; $("vbtn").style.display="none";
  $("title").style.display="flex";
};
